services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      OLLAMA_MODEL: qwen3:4b
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama:
